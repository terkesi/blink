[package]
name = "blink"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
cap-std = "3.4"
cap-fs-ext = "3.4"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync", "net", "io-util"] }
httpdate = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
